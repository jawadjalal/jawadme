<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    The favicon: the Wayari mark alone, on nothing.

    It was a white mark on a full-bleed ink tile. The founder called that weird, and it is: a
    black square in a browser tab reads as a missing image before it reads as a logo, and it
    fights every other favicon in the strip, all of which are shapes rather than tiles.

    So the ground is gone and the mark is the icon. The obvious cost is that a black mark
    disappears in a dark tab strip, which is exactly what the tile was there to prevent. The
    `prefers-color-scheme` block below is the answer: the mark inverts to paper on a dark strip
    and stays ink on a light one. Firefox, Safari and Chrome all honour a media query inside an
    SVG favicon, and a browser that does not simply gets the ink mark, which is the common case.

    Do not put the tile back to fix dark mode. Fix the media query.
  -->
  <title>Wayari</title>
  <style>
    .mark { fill: #0a0a0a; }
    
  </style>
